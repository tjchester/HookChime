name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Only the test project itself (single-target net10.0) is built here, so this
      # doesn't require compiling the Windows-specific TFM on non-Windows runners.
      - run: dotnet test tests/HookChime.Tests/HookChime.Tests.csproj --configuration Release

  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tfm: net10.0-windows10.0.19041.0
          - os: ubuntu-latest
            tfm: net10.0
          - os: macos-latest
            tfm: net10.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/HookChime.Cli/HookChime.Cli.csproj -f ${{ matrix.tfm }} --configuration Release
